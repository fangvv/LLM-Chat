<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenseNova U1.5 - 图像生成</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161822;
            --bg-card: #1c1f2e;
            --bg-card-hover: #242738;
            --bg-input: #1a1d2b;
            --border-color: #2a2d3e;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0b0;
            --text-muted: #5a6070;
            --accent: #4a6cf7;
            --accent-hover: #5b7bff;
            --accent-glow: rgba(74, 108, 247, .25);
            --success: #34d399;
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, .1);
            --shadow: 0 4px 24px rgba(0, 0, 0, .3);
            --radius: 12px;
            --radius-sm: 8px;
        }

        [data-theme="light"] {
            --bg-primary: #f5f6fa;
            --bg-secondary: #fff;
            --bg-card: #eef0f6;
            --bg-card-hover: #e4e7ef;
            --bg-input: #f0f1f6;
            --border-color: #d1d5e0;
            --text-primary: #1a1d2e;
            --text-secondary: #5a6070;
            --text-muted: #9098a8;
            --accent: #4a6cf7;
            --accent-hover: #3b5de7;
            --accent-glow: rgba(74, 108, 247, .15);
            --success: #10b981;
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, .08);
            --shadow: 0 4px 24px rgba(0, 0, 0, .08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden
        }

        ::-webkit-scrollbar {
            width: 6px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px
        }

        .app {
            display: flex;
            height: 100vh
        }

        /* Left */
        .left {
            width: 370px;
            min-width: 370px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column
        }

        .left-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color)
        }

        .left-header h1 {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .left-header h1 .logo {
            width: 26px;
            height: 26px;
            background: var(--accent);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            font-weight: 700
        }

        .left-header .sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            margin-left: 36px
        }

        .settings {
            padding: 12px 20px 14px;
            border-bottom: 1px solid var(--border-color)
        }

        .sec-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 10px
        }

        .fg {
            margin-bottom: 10px
        }

        .fg label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px
        }

        .fg input,
        .fg select {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            transition: border-color .2s, box-shadow .2s
        }

        .fg input:focus,
        .fg select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow)
        }

        .btn-save {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background: var(--accent);
            color: #fff;
            font-family: 'Inter', sans-serif
        }

        .btn-save:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow)
        }

        .btn-save:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0
        }

        .dot.ok {
            background: var(--success);
            box-shadow: 0 0 8px rgba(52, 211, 153, .5)
        }

        .dot.err {
            background: var(--error);
            box-shadow: 0 0 8px rgba(239, 68, 68, .5)
        }

        .dot.loading {
            background: var(--accent);
            animation: pulse 1.5s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .err-msg {
            background: var(--error-bg);
            color: var(--error);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            margin-top: 6px;
            display: none
        }

        .err-msg.show {
            display: block
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color)
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all .15s;
            border: none;
            border-bottom: 2px solid transparent;
            background: none;
            font-family: 'Inter', sans-serif
        }

        .tab:hover {
            color: var(--text-secondary);
            background: var(--bg-card)
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent)
        }

        /* Params */
        .params {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px
        }

        .pg {
            margin-bottom: 14px
        }

        .pg-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 6px
        }

        .pg-head .hint {
            font-size: 9px;
            text-transform: none;
            letter-spacing: normal
        }

        .pg textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 70px;
            line-height: 1.5;
            transition: border-color .2s
        }

        .pg textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow)
        }

        .pg textarea::placeholder {
            color: var(--text-muted)
        }

        .pg select,
        .pg input[type="text"],
        .pg input[type="number"] {
            width: 100%;
            padding: 7px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color .2s
        }

        .pg select:focus,
        .pg input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow)
        }

        .row {
            display: flex;
            gap: 8px
        }

        .row>* {
            flex: 1;
            min-width: 0
        }

        .chk {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0
        }

        .chk input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer
        }

        .chk label {
            font-size: 12px;
            cursor: pointer;
            color: var(--text-secondary)
        }

        .gen-btn {
            padding: 10px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
            font-family: 'Inter', sans-serif
        }

        .gen-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow)
        }

        .gen-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            box-shadow: none
        }

        /* Right */
        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0
        }

        .right-header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary)
        }

        .right-title {
            font-size: 15px;
            font-weight: 600
        }

        .right-actions {
            display: flex;
            gap: 6px
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px 10px;
            font-size: 11px;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-family: 'Inter', sans-serif
        }

        .icon-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary)
        }

        .results {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        /* Cards */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeIn .3s ease
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .card-head {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px
        }

        .card-model {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            white-space: nowrap
        }

        .card-prompt {
            flex: 1;
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .card-time {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap
        }

        .card-body {
            padding: 16px;
            display: flex;
            justify-content: center;
            background: var(--bg-primary)
        }

        .card-body img,
        .card-body video {
            max-width: 100%;
            max-height: 500px;
            border-radius: var(--radius-sm);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .3)
        }

        .card-body img {
            object-fit: contain;
            cursor: pointer;
            transition: transform .15s
        }

        .card-body img:hover {
            transform: scale(1.01)
        }

        .card-foot {
            padding: 10px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .card-foot .info {
            font-size: 10px;
            color: var(--text-muted)
        }

        .card-foot .actions {
            display: flex;
            gap: 6px
        }

        .card-foot .actions a,
        .card-foot .actions button {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 10px;
            font-size: 10px;
            text-decoration: none;
            transition: all .15s;
            font-family: 'Inter', sans-serif
        }

        .card-foot .actions a:hover,
        .card-foot .actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary)
        }

        /* Progress */
        .prog-wrap {
            background: var(--bg-input);
            border-radius: 6px;
            height: 6px;
            overflow: hidden;
            margin: 8px 0
        }

        .prog-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 6px;
            transition: width .5s ease;
            width: 0%
        }

        .prog-text {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 6px
        }

        /* Empty */
        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
            padding: 40px
        }

        .empty .icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px
        }

        .empty h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary)
        }

        .empty p {
            font-size: 12px;
            text-align: center;
            line-height: 1.6;
            max-width: 320px
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
            cursor: pointer
        }

        .lightbox.show {
            display: flex
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 8px;
            object-fit: contain
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            z-index: 999;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none
        }

        .toast.show {
            opacity: 1
        }

        @media(max-width:900px) {
            .left {
                width: 100%;
                min-width: 0;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid var(--border-color)
            }

            .app {
                flex-direction: column
            }
        }
        /* SenseNova */
        .api-fixed {
            padding: 7px 10px;
            background: var(--bg-input);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all
        }

        .mini {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 3px
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .file-row>input {
            flex: 1;
            min-width: 0
        }

        .thumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px
        }

        .thumb {
            position: relative;
            width: 62px;
            height: 62px
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: block
        }

        .thumb .idx {
            position: absolute;
            left: 2px;
            bottom: 2px;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 9px
        }

        .thumb .rm {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 17px;
            height: 17px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .thumb .rm:hover {
            background: var(--error)
        }

        .field-err {
            display: none;
            margin-top: 4px;
            font-size: 10px;
            color: var(--error)
        }

        .field-err.show {
            display: block
        }

        .note {
            padding: 8px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.6
        }

        .prog-bar.indet {
            width: 40%;
            animation: indet 1.2s ease-in-out infinite
        }

        @keyframes indet {
            0% {
                margin-left: -40%
            }

            100% {
                margin-left: 100%
            }
        }

    </style>
</head>

<body>

    <div class="lightbox" id="lightbox"><img id="lbImg" src=""></div>
    <div class="toast" id="toast"></div>

    <div class="app">
        <div class="left">
            <div class="left-header">
                <h1><span class="logo">S</span> SenseNova 生图</h1>
                <div class="sub">U1.5 · 文生图与图片编辑</div>
            </div>

            <div class="settings">
                <div class="sec-label">API 配置</div>
                <div class="fg">
                    <label>调用地址（固定）</label>
                    <div class="api-fixed">https://token.sensenova.cn/v1</div>
                </div>
                <div class="fg">
                    <label>API 密钥</label>
                    <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
                </div>
                <button class="btn-save" id="btnConnect">保存配置 &amp; 连接</button>
                <div class="status"><span class="dot" id="dot"></span><span id="stxt">未连接</span></div>
                <div class="err-msg" id="emsg"></div>
            </div>

            <div class="tabs">
                <button class="tab active" id="tabGen">文生图</button>
                <button class="tab" id="tabEdit">图片编辑</button>
            </div>

            <div class="params">
                <div class="pg">
                    <div class="pg-head">模型 <span class="hint">Neo-unify</span></div>
                    <select id="model">
                        <option value="sensenova-u1.5-lite" selected>sensenova-u1.5-lite</option>
                        <option value="sensenova-u1.5-fast">sensenova-u1.5-fast</option>
                    </select>
                </div>

                <!-- 文生图 -->
                <div id="genP">
                    <div class="pg">
                        <div class="pg-head">提示词 <span class="hint">必填</span></div>
                        <textarea id="genPrompt" rows="4"
                            placeholder="描述想要的画面，例如：一只白色小海豹漂浮在平静的海面上，清晨柔和的光线，写实风格"></textarea>
                    </div>
                    <div class="pg">
                        <div class="pg-head">分辨率 <span class="hint">2K / 4K</span></div>
                        <select id="genSize"></select>
                        <div class="row" id="genCustom" style="display:none;margin-top:6px">
                            <div><label class="mini">宽度 W</label><input type="number" id="genW" value="2048" min="512"
                                    max="4096" step="32"></div>
                            <div><label class="mini">高度 H</label><input type="number" id="genH" value="2048" min="512"
                                    max="4096" step="32"></div>
                        </div>
                        <div class="field-err" id="genErr"></div>
                    </div>
                    <div class="pg">
                        <div class="pg-head">图片格式</div>
                        <select id="genOfmt">
                            <option value="png" selected>PNG</option>
                            <option value="jpeg">JPEG</option>
                            <option value="webp">WebP</option>
                        </select>
                    </div>
                    <div class="pg">
                        <div class="pg-head">返回方式</div>
                        <select id="genFmt">
                            <option value="url" selected>URL（24 小时有效）</option>
                            <option value="b64_json">Base64</option>
                        </select>
                    </div>
                    <div class="pg">
                        <div class="pg-head">高级选项</div>
                        <div class="chk"><input type="checkbox" id="genPx" checked><label for="genPx">提示词自动增强</label></div>
                        <div class="chk"><input type="checkbox" id="genWm"><label for="genWm">添加 SenseNova 水印</label></div>
                    </div>
                    <button class="gen-btn" id="genBtn" disabled>生成图片</button>
                </div>

                <!-- 图片编辑 -->
                <div id="editP" style="display:none">
                    <div class="pg">
                        <div class="pg-head">参考图片 <span class="hint">最多 5 张 · 首图为主图</span></div>
                        <div class="file-row">
                            <button class="icon-btn" id="btnPick">＋ 本地图片</button>
                            <input type="file" id="editFiles" accept="image/*" multiple hidden>
                            <span class="hint" id="refCount">0 / 5</span>
                        </div>
                        <div class="file-row" style="margin-top:6px">
                            <input type="text" id="refUrl" placeholder="或粘贴公开图片 URL">
                            <button class="icon-btn" id="btnAddUrl">添加</button>
                        </div>
                        <div class="thumbs" id="thumbs"></div>
                    </div>
                    <div class="pg">
                        <div class="pg-head">编辑指令 <span class="hint">必填</span></div>
                        <textarea id="editPrompt" rows="4"
                            placeholder="描述期望的结果，例如：把背景换成广阔的冰川，保持主体不变"></textarea>
                    </div>
                    <div class="pg">
                        <div class="pg-head">分辨率 <span class="hint">auto 跟随主图</span></div>
                        <select id="editSize"></select>
                        <div class="row" id="editCustom" style="display:none;margin-top:6px">
                            <div><label class="mini">宽度 W</label><input type="number" id="editW" value="2048" min="512"
                                    max="4096" step="32"></div>
                            <div><label class="mini">高度 H</label><input type="number" id="editH" value="2048" min="512"
                                    max="4096" step="32"></div>
                        </div>
                        <div class="field-err" id="editErr"></div>
                    </div>
                    <div class="pg">
                        <div class="pg-head">图片格式</div>
                        <select id="editOfmt">
                            <option value="png" selected>PNG</option>
                            <option value="jpeg">JPEG</option>
                            <option value="webp">WebP</option>
                        </select>
                    </div>
                    <div class="pg">
                        <div class="pg-head">返回方式</div>
                        <select id="editFmt">
                            <option value="url" selected>URL（24 小时有效）</option>
                            <option value="b64_json">Base64</option>
                        </select>
                    </div>
                    <div class="pg">
                        <div class="pg-head">高级选项</div>
                        <div class="chk"><input type="checkbox" id="editPx" checked><label for="editPx">提示词自动增强</label></div>
                        <div class="chk"><input type="checkbox" id="editWm"><label for="editWm">添加 SenseNova 水印</label></div>
                    </div>
                    <button class="gen-btn" id="editBtn" disabled>开始编辑</button>
                </div>

                <div class="note">
                    同步接口，单张约 10–60 秒；n 仅支持 1；URL 结果 24 小时后失效，需长期保存请下载。
                </div>
            </div>
        </div>

        <div class="right">
            <div class="right-header">
                <span class="right-title" id="rTitle">文生图</span>
                <div class="right-actions">
                    <button class="icon-btn" id="btnClear">清空历史</button>
                    <button class="icon-btn" id="btnTheme">深色</button>
                </div>
            </div>
            <div class="results" id="results">
                <div class="empty" id="emptyEl">
                    <div class="icon">S</div>
                    <h2>准备就绪</h2>
                    <p>输入 API 密钥并连接，然后填写提示词开始生成</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // 调用地址固定为 SenseNova OpenAI 兼容端点，不提供修改入口
            var API_BASE = 'https://token.sensenova.cn/v1';
            var KEY_CFG = 'sensenova_img_cfg';
            var KEY_HIST = 'sensenova_img_hist';
            var KEY_THEME = 'sensenova_img_theme';
            var MAX_REFS = 5;
            var MAX_HIST = 80;

            var S = { key: '', connected: false, mode: 'gen', generating: false, history: [], refs: [], abort: null, timer: null };
            var $ = function (id) { return document.getElementById(id) };

            var el = {
                cfgKey: $('cfgKey'), btnConnect: $('btnConnect'), dot: $('dot'), stxt: $('stxt'), emsg: $('emsg'),
                model: $('model'), genP: $('genP'), editP: $('editP'), genBtn: $('genBtn'), editBtn: $('editBtn'),
                genPrompt: $('genPrompt'), genSize: $('genSize'), genCustom: $('genCustom'), genW: $('genW'), genH: $('genH'), genErr: $('genErr'),
                genOfmt: $('genOfmt'), genFmt: $('genFmt'), genPx: $('genPx'), genWm: $('genWm'),
                editPrompt: $('editPrompt'), editSize: $('editSize'), editCustom: $('editCustom'), editW: $('editW'), editH: $('editH'), editErr: $('editErr'),
                editOfmt: $('editOfmt'), editFmt: $('editFmt'), editPx: $('editPx'), editWm: $('editWm'),
                thumbs: $('thumbs'), refCount: $('refCount'), refUrl: $('refUrl'), editFiles: $('editFiles'),
                results: $('results'), emptyEl: $('emptyEl'), rTitle: $('rTitle'),
                toast: $('toast'), lightbox: $('lightbox'), lbImg: $('lbImg')
            };

            // 文档推荐分辨率：宽高需为 32 的倍数，512–4096，长宽比不超过 3:1
            var SIZES = [
                { v: '2048x2048', t: '2048×2048 · 1:1 · 2K' },
                { v: '2720x1536', t: '2720×1536 · 16:9 · 2K' },
                { v: '1536x2720', t: '1536×2720 · 9:16 · 2K' },
                { v: '1664x2496', t: '1664×2496 · 2:3 · 2K' },
                { v: '2496x1664', t: '2496×1664 · 3:2 · 2K' },
                { v: '4096x4096', t: '4096×4096 · 1:1 · 4K' },
                { v: 'auto', t: 'auto · 自动适配' },
                { v: 'custom', t: '自定义尺寸…' }
            ];

            function init() {
                loadTheme();
                try { var c = localStorage.getItem(KEY_CFG); if (c) { var p = JSON.parse(c); if (p && p.key) { S.key = p.key; el.cfgKey.value = p.key } } } catch (e) { }
                try { var h = localStorage.getItem(KEY_HIST); if (h) S.history = JSON.parse(h) || [] } catch (e) { S.history = [] }
                buildSizeSelect(el.genSize, '2048x2048');
                buildSizeSelect(el.editSize, 'auto');
                syncCustomSize(el.genSize, el.genCustom);
                syncCustomSize(el.editSize, el.editCustom);
                bind();
                renderRefs();
                renderResults();
            }

            function bind() {
                el.btnConnect.addEventListener('click', doConnect);
                el.cfgKey.addEventListener('keydown', function (e) { if (e.key === 'Enter') doConnect() });
                $('tabGen').addEventListener('click', function () { switchMode('gen') });
                $('tabEdit').addEventListener('click', function () { switchMode('edit') });
                el.genBtn.addEventListener('click', function () { startGen('gen') });
                el.editBtn.addEventListener('click', function () { startGen('edit') });
                el.genSize.addEventListener('change', function () { syncCustomSize(el.genSize, el.genCustom) });
                el.editSize.addEventListener('change', function () { syncCustomSize(el.editSize, el.editCustom) });
                $('btnPick').addEventListener('click', function () { el.editFiles.click() });
                el.editFiles.addEventListener('change', onPickFiles);
                $('btnAddUrl').addEventListener('click', addRefFromInput);
                el.refUrl.addEventListener('keydown', function (e) { if (e.key === 'Enter') addRefFromInput() });
                $('btnClear').addEventListener('click', clearHistory);
                $('btnTheme').addEventListener('click', toggleTheme);
                el.lightbox.addEventListener('click', closeLB);
                document.addEventListener('keydown', onKey);
            }

            /* ---------- 主题 ---------- */
            function toggleTheme() {
                var light = document.documentElement.getAttribute('data-theme') !== 'light';
                document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
                localStorage.setItem(KEY_THEME, light ? 'light' : 'dark');
                $('btnTheme').textContent = light ? '浅色' : '深色';
            }
            function loadTheme() {
                if (localStorage.getItem(KEY_THEME) === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    $('btnTheme').textContent = '浅色';
                }
            }

            /* ---------- 连接与模型 ---------- */
            function doConnect() {
                var key = el.cfgKey.value.trim();
                if (!key) { showErr('请输入 API 密钥'); el.cfgKey.focus(); return }
                S.key = key;
                try { localStorage.setItem(KEY_CFG, JSON.stringify({ key: key })) } catch (e) { }
                setDot('loading', '验证中…'); hideErr();
                el.btnConnect.disabled = true;

                fetch(API_BASE + '/models', { headers: { Authorization: 'Bearer ' + key } })
                    .then(function (r) {
                        return r.text().then(function (txt) {
                            if (!r.ok) throw new Error(httpError(r.status, txt));
                            try { return JSON.parse(txt) } catch (e) { throw new Error('响应解析失败') }
                        });
                    })
                    .then(function (d) {
                        var models = (d && d.data) || [];
                        S.connected = true;
                        var found = populateModels(models);
                        setDot('ok', found ? '已连接 · U1.5 可用' : '已连接 · ' + models.length + ' 个模型');
                        el.genBtn.disabled = false; el.editBtn.disabled = false;
                        el.btnConnect.textContent = '已连接';
                        setTimeout(function () { el.btnConnect.textContent = '保存配置 & 连接' }, 2000);
                    })
                    .catch(function (e) {
                        S.connected = false;
                        var msg = friendlyError(e);
                        showErr(msg); setDot('err', '连接失败');
                        el.genBtn.disabled = true; el.editBtn.disabled = true;
                    })
                    .finally(function () { el.btnConnect.disabled = false });
            }
            function setDot(cls, txt) { el.dot.className = 'dot ' + cls; el.stxt.textContent = txt }
            function showErr(m) { el.emsg.textContent = m; el.emsg.classList.add('show') }
            function hideErr() { el.emsg.classList.remove('show') }

            function populateModels(models) {
                var ids = models.map(function (m) { return m && m.id ? m.id : '' }).filter(Boolean);
                var prefer = ['sensenova-u1.5-lite', 'sensenova-u1.5-fast'];
                var known = prefer.filter(function (id) { return ids.indexOf(id) >= 0 });
                var list = known.length ? known : ids.filter(function (id) { return /image|u1/i.test(id) });
                if (!list.length) list = prefer;
                fillModelSelect(list, el.model.value || 'sensenova-u1.5-lite');
                return known.length > 0;
            }
            function fillModelSelect(list, def) {
                el.model.innerHTML = '';
                list.forEach(function (id) {
                    var o = document.createElement('option');
                    o.value = id; o.textContent = id;
                    el.model.appendChild(o);
                });
                if (def && list.indexOf(def) >= 0) el.model.value = def;
            }

            /* ---------- 模式 ---------- */
            function switchMode(m) {
                S.mode = m;
                $('tabGen').classList.toggle('active', m === 'gen');
                $('tabEdit').classList.toggle('active', m === 'edit');
                el.genP.style.display = m === 'gen' ? '' : 'none';
                el.editP.style.display = m === 'edit' ? '' : 'none';
                el.rTitle.textContent = m === 'gen' ? '文生图' : '图片编辑';
                renderResults();
            }

            /* ---------- 尺寸 ---------- */
            function buildSizeSelect(sel, def) {
                sel.innerHTML = '';
                SIZES.forEach(function (s) {
                    var o = document.createElement('option');
                    o.value = s.v; o.textContent = s.t;
                    if (s.v === def) o.selected = true;
                    sel.appendChild(o);
                });
            }
            function syncCustomSize(sel, box) {
                box.style.display = sel.value === 'custom' ? '' : 'none';
            }
            function readSize(mode) {
                var sel = mode === 'gen' ? el.genSize : el.editSize;
                var err = mode === 'gen' ? el.genErr : el.editErr;
                hideFieldErr(err);
                if (sel.value === 'auto') return 'auto';
                if (sel.value !== 'custom') return sel.value;
                var w = parseInt(mode === 'gen' ? el.genW.value : el.editW.value, 10);
                var h = parseInt(mode === 'gen' ? el.genH.value : el.editH.value, 10);
                var problem = sizeProblem(w, h);
                if (problem) { showFieldErr(err, problem); return null }
                return w + 'x' + h;
            }
            function sizeProblem(w, h) {
                if (!w || !h) return '请填写宽度和高度';
                if (w % 32 || h % 32) return '宽高需为 32 的倍数';
                if (w < 512 || h < 512) return '宽高最小 512';
                if (w > 4096 || h > 4096) return '宽高最大 4096';
                if (Math.max(w, h) / Math.min(w, h) > 3) return '长宽比不能超过 3:1';
                return '';
            }
            function showFieldErr(node, msg) { node.textContent = msg; node.classList.add('show') }
            function hideFieldErr(node) { node.classList.remove('show') }

            /* ---------- 参考图片 ---------- */
            function onPickFiles() {
                var files = el.editFiles.files;
                var arr = files ? Array.prototype.slice.call(files) : [];
                el.editFiles.value = '';
                if (!arr.length) return;
                var slots = MAX_REFS - S.refs.length;
                if (slots <= 0) { toast('最多添加 ' + MAX_REFS + ' 张参考图片'); return }
                if (arr.length > slots) { arr = arr.slice(0, slots); toast('最多 ' + MAX_REFS + ' 张，已取前 ' + slots + ' 张') }
                arr.forEach(function (f) {
                    if (!/^image\//.test(f.type)) { toast('已跳过非图片文件：' + f.name); return }
                    var reader = new FileReader();
                    reader.onload = function () { addRef(reader.result) };
                    reader.onerror = function () { toast('读取失败：' + f.name) };
                    reader.readAsDataURL(f);
                });
            }
            function addRefFromInput() {
                var u = el.refUrl.value.trim();
                if (!u) { toast('请粘贴图片 URL'); return }
                if (!/^(https?:\/\/|data:image\/)/i.test(u)) { toast('仅支持 http(s) 链接或 data:image 数据'); return }
                if (addRef(u)) el.refUrl.value = '';
            }
            function addRef(url) {
                if (S.refs.length >= MAX_REFS) { toast('最多添加 ' + MAX_REFS + ' 张参考图片'); return false }
                if (S.refs.indexOf(url) >= 0) { toast('该图片已添加'); return false }
                S.refs.push(url); renderRefs(); return true;
            }
            function renderRefs() {
                el.thumbs.innerHTML = '';
                S.refs.forEach(function (u, i) {
                    var box = document.createElement('div'); box.className = 'thumb';
                    var img = document.createElement('img'); img.src = u; img.alt = '参考图 ' + (i + 1);
                    var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = i === 0 ? '主图' : String(i + 1);
                    var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = '×'; rm.title = '移除';
                    rm.addEventListener('click', function () { S.refs.splice(i, 1); renderRefs() });
                    box.appendChild(img); box.appendChild(idx); box.appendChild(rm);
                    el.thumbs.appendChild(box);
                });
                el.refCount.textContent = S.refs.length + ' / ' + MAX_REFS;
            }

            /* ---------- 生成 ---------- */
            function startGen(mode) {
                if (S.generating) { toast('正在生成中，请稍候'); return }
                if (!S.key) { toast('请先输入 API 密钥并连接'); el.cfgKey.focus(); return }

                var ta = mode === 'gen' ? el.genPrompt : el.editPrompt;
                var prompt = ta.value.trim();
                if (!prompt) { toast(mode === 'gen' ? '请输入提示词' : '请输入编辑指令'); ta.focus(); return }

                var size = readSize(mode);
                if (!size) return;

                var ofmt = (mode === 'gen' ? el.genOfmt : el.editOfmt).value;
                var body = {
                    model: el.model.value,
                    prompt: prompt,
                    n: 1,
                    output_format: ofmt,
                    response_format: (mode === 'gen' ? el.genFmt : el.editFmt).value,
                    prompt_extend: (mode === 'gen' ? el.genPx : el.editPx).checked,
                    watermark: (mode === 'gen' ? el.genWm : el.editWm).checked
                };
                if (size !== 'auto') body.size = size;

                var path = '/images/generations';
                var refs = 0;
                if (mode === 'edit') {
                    if (!S.refs.length) { toast('请至少添加一张参考图片'); return }
                    path = '/images/edits';
                    refs = S.refs.length;
                    body.images = S.refs.map(function (u) { return { image_url: u } });
                }

                var btn = mode === 'gen' ? el.genBtn : el.editBtn;
                var cardId = addPending(body.model, prompt);
                S.generating = true;
                hideErr();
                btn.disabled = true; btn.textContent = '生成中…';

                var t0 = Date.now();
                S.timer = setInterval(function () {
                    var s = Math.round((Date.now() - t0) / 1000);
                    var st = document.getElementById(cardId + '_st');
                    if (st) st.textContent = '生成中 ' + s + 's（Esc 取消）';
                    btn.textContent = '生成中 ' + s + 's…';
                }, 1000);

                var ctrl = S.abort = new AbortController();

                fetch(API_BASE + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.key },
                    body: JSON.stringify(body),
                    signal: ctrl.signal
                })
                    .then(function (r) {
                        return r.text().then(function (txt) {
                            if (!r.ok) throw new Error(httpError(r.status, txt));
                            try { return JSON.parse(txt) } catch (e) { throw new Error('响应解析失败：' + txt.slice(0, 120)) }
                        });
                    })
                    .then(function (data) {
                        var items = collectItems(data, mode, body, refs);
                        if (!items.length) throw new Error('接口未返回图片数据');
                        S.history = items.concat(S.history);
                        if (S.history.length > MAX_HIST) S.history.length = MAX_HIST;
                        saveHist();
                        removePending(cardId);
                        stopGen();
                        renderResults();
                        toast('生成完成');
                    })
                    .catch(function (e) {
                        var aborted = e && e.name === 'AbortError';
                        var msg = friendlyError(e);
                        removePending(cardId);
                        stopGen();
                        renderResults();
                        if (aborted) { toast('已取消'); return }
                        showErr(msg); toast(msg);
                    });
            }

            function collectItems(data, mode, body, refs) {
                var out = [];
                var list = (data && data.data) || [];
                var usage = (data && data.usage) || null;
                var mime = body.output_format === 'jpeg' ? 'jpeg' : body.output_format;
                for (var i = 0; i < list.length; i++) {
                    var it = list[i] || {};
                    var url = it.url || '';
                    var remote = !!url;
                    if (!url && it.b64_json) url = 'data:image/' + mime + ';base64,' + it.b64_json;
                    if (!url) continue;
                    out.push({
                        mode: mode,
                        model: body.model,
                        prompt: body.prompt,
                        url: url,
                        time: ts(),
                        size: (data && data.size) || body.size || 'auto',
                        ofmt: body.output_format,
                        tokens: usage && usage.total_tokens ? usage.total_tokens : 0,
                        remote: remote,
                        refs: refs
                    });
                }
                return out;
            }

            function stopGen() {
                S.generating = false; S.abort = null;
                if (S.timer) { clearInterval(S.timer); S.timer = null }
                var dis = !S.connected;
                el.genBtn.disabled = dis; el.editBtn.disabled = dis;
                el.genBtn.textContent = '生成图片'; el.editBtn.textContent = '开始编辑';
            }
            function cancelGen() {
                if (S.generating && S.abort) S.abort.abort();
            }

            function addPending(model, prompt) {
                el.emptyEl.style.display = 'none';
                var id = 'pc_' + Date.now();
                var card = document.createElement('div'); card.className = 'card'; card.id = id;
                card.appendChild(mkHead(model, prompt, ts()));

                var body = document.createElement('div'); body.className = 'card-body';
                body.style.flexDirection = 'column'; body.style.alignItems = 'center';
                body.style.padding = '32px'; body.style.gap = '10px';

                var icon = document.createElement('div'); icon.textContent = '🎨'; icon.style.fontSize = '26px';
                var st = document.createElement('div'); st.className = 'prog-text'; st.id = id + '_st'; st.textContent = '提交中…';
                var wrap = document.createElement('div'); wrap.className = 'prog-wrap'; wrap.style.width = '220px';
                var bar = document.createElement('div'); bar.className = 'prog-bar indet';
                wrap.appendChild(bar);

                body.appendChild(icon); body.appendChild(st); body.appendChild(wrap);
                card.appendChild(body);
                el.results.insertBefore(card, el.results.firstChild);
                return id;
            }
            function removePending(id) {
                var c = document.getElementById(id);
                if (c && c.parentNode) c.parentNode.removeChild(c);
            }

            /* ---------- 结果渲染 ---------- */
            function renderResults() {
                while (el.results.firstChild) el.results.removeChild(el.results.firstChild);
                var items = S.history.filter(function (h) { return h.mode === S.mode });
                if (!items.length) { el.results.appendChild(el.emptyEl); el.emptyEl.style.display = 'flex'; return }
                el.emptyEl.style.display = 'none';

                items.forEach(function (item) {
                    var card = document.createElement('div'); card.className = 'card';
                    card.appendChild(mkHead(item.model, item.prompt, item.time));

                    var body = document.createElement('div'); body.className = 'card-body';
                    var img = document.createElement('img');
                    img.src = item.url; img.alt = '生成的图片'; img.loading = 'lazy';
                    img.addEventListener('click', function () { openLB(item.url) });
                    img.onerror = function () {
                        this.onerror = null; this.style.padding = '40px';
                        this.style.color = 'var(--error)'; this.style.fontSize = '13px';
                        this.alt = '图片加载失败（链接可能已过期）';
                    };
                    body.appendChild(img);
                    card.appendChild(body);

                    var foot = document.createElement('div'); foot.className = 'card-foot';
                    var info = document.createElement('span'); info.className = 'info';
                    var bits = [item.size];
                    if (item.refs) bits.push('参考图 ×' + item.refs);
                    if (item.tokens) bits.push(item.tokens + ' tokens');
                    bits.push(item.remote ? '链接 24h 有效' : 'Base64');
                    info.textContent = bits.join(' · ');

                    var acts = document.createElement('div'); acts.className = 'actions';
                    var dl = document.createElement('a');
                    dl.href = item.url; dl.target = '_blank'; dl.rel = 'noopener';
                    dl.download = 'sensenova-' + Date.now() + '.' + (item.ofmt === 'jpeg' ? 'jpg' : (item.ofmt || 'png'));
                    dl.textContent = '下载';

                    var reuse = document.createElement('button'); reuse.textContent = '复用提示词';
                    reuse.addEventListener('click', function () {
                        var ta = item.mode === 'gen' ? el.genPrompt : el.editPrompt;
                        ta.value = item.prompt; ta.focus(); toast('提示词已填入');
                    });

                    var del = document.createElement('button'); del.textContent = '删除';
                    del.addEventListener('click', function () { deleteItem(item) });

                    acts.appendChild(dl); acts.appendChild(reuse); acts.appendChild(del);
                    foot.appendChild(info); foot.appendChild(acts);
                    card.appendChild(foot);
                    el.results.appendChild(card);
                });
            }
            function mkHead(model, prompt, time) {
                var h = document.createElement('div'); h.className = 'card-head';
                var m = document.createElement('span'); m.className = 'card-model'; m.textContent = model || '';
                var p = document.createElement('span'); p.className = 'card-prompt'; p.textContent = prompt || ''; p.title = prompt || '';
                var t = document.createElement('span'); t.className = 'card-time'; t.textContent = time || '';
                h.appendChild(m); h.appendChild(p); h.appendChild(t); return h;
            }

            /* ---------- 历史 ---------- */
            var quotaWarned = false;
            function saveHist() {
                try { localStorage.setItem(KEY_HIST, JSON.stringify(S.history)); return } catch (e) { }
                // Base64 图片体积大，超出配额时仅持久化在线链接
                var slim = S.history.filter(function (h) { return !/^data:/.test(h.url) });
                try { localStorage.setItem(KEY_HIST, JSON.stringify(slim)) } catch (e2) { }
                if (!quotaWarned) { quotaWarned = true; toast('本地存储不足：Base64 图片不会写入历史') }
            }
            function deleteItem(item) {
                var i = S.history.indexOf(item);
                if (i >= 0) { S.history.splice(i, 1); saveHist(); renderResults() }
            }
            function clearHistory() {
                if (!confirm('确定清空当前模式的历史？')) return;
                S.history = S.history.filter(function (h) { return h.mode !== S.mode });
                saveHist(); renderResults();
            }

            /* ---------- 工具 ---------- */
            function ts() { return new Date().toLocaleString() }
            function httpError(status, txt) {
                try {
                    var d = JSON.parse(txt);
                    var e = d && d.error;
                    if (e) {
                        var meta = [];
                        if (e.type) meta.push(e.type);
                        if (e.code !== undefined && e.code !== null && e.code !== '') meta.push('code ' + e.code);
                        return (e.message || '请求失败') + (meta.length ? '（' + meta.join(' / ') + '）' : '');
                    }
                } catch (err) { }
                return 'HTTP ' + status + (txt ? '：' + txt.slice(0, 160) : '');
            }
            function friendlyError(e) {
                if (!e) return '未知错误';
                if (e.name === 'AbortError') return '已取消';
                var m = e.message || String(e);
                if (/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) {
                    return '网络请求失败：接口未响应浏览器 CORS 预检（或网络不可达），需通过本地反向代理访问。';
                }
                return m;
            }
            var toastTimer = null;
            function toast(msg) {
                el.toast.textContent = msg;
                el.toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { el.toast.classList.remove('show') }, 3000);
            }
            function openLB(url) { el.lbImg.src = url; el.lightbox.classList.add('show') }
            function closeLB() { el.lightbox.classList.remove('show'); el.lbImg.src = '' }
            function onKey(e) {
                if (e.key !== 'Escape') return;
                if (el.lightbox.classList.contains('show')) { closeLB(); return }
                if (S.generating) cancelGen();
            }

            init();
        })();
    </script>
</body>

</html>
